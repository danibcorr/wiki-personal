[project]
site_name = "Daniel Bazo Correa"
site_description = "🏛️ Mi wiki personal como ingeniero y científico de datos en Español"
site_author = "Daniel Bazo Correa"
site_url = "https://danibcorr.github.io/wiki-personal/"
repo_url = "https://github.com/danibcorr/wiki-personal"
repo_name = "danibcorr/wiki-personal"
copyright = "Copyright &copy; 2026 Daniel Bazo Correa"
nav = [
    {"Inicio" = "index.md"},
    {"Sistemas Operativos" = [
        "topic_1_operative_systems/section_1_linux.md"
    ]},
    {"Herramientas" = [
        "topic_2_tools/section_1_git.md"
    ]},
    {"Programación" = [
        {"Python" = [
            "topic_3_programming/topic_3_1_python/section_1_environments.md",
            "topic_3_programming/topic_3_1_python/section_2_fundamentals.md",
            "topic_3_programming/topic_3_1_python/section_3_arrays.md",
            "topic_3_programming/topic_3_1_python/section_4_leetcode.md",
            "topic_3_programming/topic_3_1_python/section_5_libraries.md",
        ]},
        {"Scripting" = [
            "topic_3_programming/topic_3_2_scripting/section_1_bash.md",
            "topic_3_programming/topic_3_2_scripting/section_2_makefile.md"
        ]},
        {"Bases de Datos" = [
            "topic_3_programming/topic_3_3_databases/section_1_sql.md",
            "topic_3_programming/topic_3_3_databases/section_2_exercises.md"
        ]},
        {"CUDA" = [
            "topic_3_programming/topic_3_4_cuda/section_1_fundamentals.md",
            "topic_3_programming/topic_3_4_cuda/section_2_exercises.md"
        ]},
        {"Front End" = [
            "topic_3_programming/topic_3_5_front_end/section_1_fundamentals.md"
        ]}
    ]},
    {"Inteligencia Artificial" = [
        {"Machine Learning" = [
            "topic_5_artificial_intelligence/topic_5_1_machine_learning/section_1_fundamentals.md"
        ]},
        {"Deep Learning" = [
            "topic_5_artificial_intelligence/topic_5_2_deep_learning/section_1_fundamentals.md",
            "topic_5_artificial_intelligence/topic_5_2_deep_learning/section_2_generative_ai.md",
            "topic_5_artificial_intelligence/topic_5_2_deep_learning/section_3_graph_neural_networks.md",
            "topic_5_artificial_intelligence/topic_5_2_deep_learning/section_4_reinforcement_learning.md",
            "topic_5_artificial_intelligence/topic_5_2_deep_learning/section_5_agents.md"
        ]},
        {"Librerías" = [
            "topic_5_artificial_intelligence/topic_5_2_deep_learning/libraries/jax.md",
            "topic_5_artificial_intelligence/topic_5_2_deep_learning/libraries/pytorch.md",
            "topic_5_artificial_intelligence/topic_5_2_deep_learning/libraries/tensorflow.md"
        ]}
    ]},
    {"Metodologías" = [
        {"Ingeniería de Software" = [
            "topic_6_methodologies/topic_6_1_software/section_1_design_patterns.md",
            "topic_6_methodologies/topic_6_1_software/section_2_sustainable_code.md",
            "topic_6_methodologies/topic_6_1_software/section_3_data_structure.md",
            "topic_6_methodologies/topic_6_1_software/section_4_cloud_computing.md"
        ]},
        {"DevOps" = [
            "topic_6_methodologies/topic_6_2_devops/section_1_containers.md",
            "topic_6_methodologies/topic_6_2_devops/section_2_orchestrators.md",
            "topic_6_methodologies/topic_6_2_devops/section_3_ci_cd.md"
        ]},
        {"MLOps" = [
            "topic_6_methodologies/topic_6_3_mlops/section_1_fundamentals.md",
            "topic_6_methodologies/topic_6_3_mlops/section_2_experiment_management.md",
            "topic_6_methodologies/topic_6_3_mlops/section_3_monitoring.md",
            "topic_6_methodologies/topic_6_3_mlops/section_4_deployment.md"
        ]}
    ]},
    {"Cloud" = [
        {"AWS" = [
            "topic_7_cloud/topic_7_1_aws/section_1_fundamentals.md"
        ]}
    ]},
    {"Otros" = [
        "topic_A_interviews/cv_guide.md"
    ]},
]
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"
]

[project.theme]
language = "es"
logo = "/assets/img/logo motivo dark.svg"
favicon = "/assets/img/logo.ico"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
homepage = "https://www.linkedin.com/in/danibcorr/"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/danibcorr/"

[project.markdown_extensions.admonition]
[project.markdown_extensions.tables]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
toc_depth = 3

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
